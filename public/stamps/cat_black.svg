<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 猫耳 (黒耳) -->
  <path d="M 22 36 L 28 10 L 44 26 Z" fill="#2d3436" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 26 33 L 30 16 L 41 27 Z" fill="#ff7675"/>
  
  <path d="M 78 36 L 72 10 L 56 26 Z" fill="#2d3436" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 74 33 L 70 16 L 59 27 Z" fill="#ff7675"/>

  <!-- 猫顔本体 -->
  <circle cx="50" cy="52" r="40" fill="#2d3436" stroke="#2d3436" stroke-width="2"/>

  <!-- 大きな黄色い目 -->
  <circle cx="36" cy="46" r="7.5" fill="#fdcb6e"/>
  <ellipse cx="36" cy="46" rx="2.5" ry="6.5" fill="#2d3436"/>
  <circle cx="34" cy="42" r="2" fill="#ffffff"/>

  <circle cx="64" cy="46" r="7.5" fill="#fdcb6e"/>
  <ellipse cx="64" cy="46" rx="2.5" ry="6.5" fill="#2d3436"/>
  <circle cx="62" cy="42" r="2" fill="#ffffff"/>

  <!-- 八重歯と鼻 -->
  <polygon points="50,54 48,51 52,51" fill="#ff7675"/>
  <!-- 小さな牙/口 -->
  <path d="M 44 57 Q 50 63 56 57" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="46,58 48,63 49,58" fill="#ffffff"/>
  <polygon points="51,58 52,63 54,58" fill="#ffffff"/>

  <!-- 白いヒゲ -->
  <line x1="8" y1="46" x2="21" y2="48" stroke="#fdcb6e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="54" x2="22" y2="53" stroke="#fdcb6e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="46" x2="79" y2="48" stroke="#fdcb6e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="54" x2="78" y2="53" stroke="#fdcb6e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 下部飾り -->
  <circle cx="50" cy="80" r="4" fill="#fdcb6e"/>
</svg>
