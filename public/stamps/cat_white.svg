<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <path id="whiteTextArc" d="M 25 78 A 32 32 0 0 0 75 78" />
  </defs>

  <!-- 背後バッジ背景 (クリーム色＋ダークブラウン縁) -->
  <circle cx="50" cy="50" r="42" fill="#fff8f0" stroke="#3d2d27" stroke-width="5" />

  <!-- 下部テキストリボン領域 (ダークブラウン背景) -->
  <path d="M 17 62 A 42 42 0 0 0 83 62 C 78 88, 22 88, 17 62 Z" fill="#3d2d27" />

  <!-- 白猫の顔＆耳 -->
  <!-- 左耳 -->
  <path d="M 20 40 L 26 10 C 27 8, 30 8, 32 10 L 46 28 Z" fill="#ffffff" stroke="#3d2d27" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 25 36 L 29 16 L 41 27 Z" fill="#ff9ff3"/>
  <!-- 右耳 -->
  <path d="M 80 40 L 74 10 C 73 8, 70 8, 68 10 L 54 28 Z" fill="#ffffff" stroke="#3d2d27" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 75 36 L 71 16 L 59 27 Z" fill="#ff9ff3"/>

  <!-- 猫顔の頭輪郭 -->
  <circle cx="50" cy="48" r="32" fill="#ffffff" stroke="#3d2d27" stroke-width="4" />

  <!-- キラキラ目 (左) -->
  <circle cx="35" cy="44" r="7" fill="#3d2d27"/>
  <circle cx="33" cy="41" r="2.8" fill="#ffffff"/>
  <circle cx="38" cy="46" r="1.5" fill="#ffffff"/>
  <polygon points="38,41 39,43 41,43 39.5,44 40,46 38,45 36,46 36.5,44 35,43 37,43" fill="#ffffff" opacity="0.8"/>

  <!-- キラキラ目 (右) -->
  <circle cx="65" cy="44" r="7" fill="#3d2d27"/>
  <circle cx="63" cy="41" r="2.8" fill="#ffffff"/>
  <circle cx="68" cy="46" r="1.5" fill="#ffffff"/>
  <polygon points="68,41 69,43 71,43 69.5,44 70,46 68,45 66,46 66.5,44 65,43 67,43" fill="#ffffff" opacity="0.8"/>

  <!-- 鼻と口 (にっこり) -->
  <polygon points="50,50 47,47 53,47" fill="#ff6b6b" rx="1"/>
  <path d="M 42 53 Q 50 63 58 53" fill="#ff6b6b" stroke="#3d2d27" stroke-width="3" stroke-linecap="round"/>
  <path d="M 42 53 Q 46 56 50 53 Q 54 56 58 53" fill="none" stroke="#3d2d27" stroke-width="3" stroke-linecap="round"/>

  <!-- ほっぺ (チーク) -->
  <ellipse cx="25" cy="51" rx="5" ry="3.5" fill="#ff7675" opacity="0.6"/>
  <ellipse cx="75" cy="51" rx="5" ry="3.5" fill="#ff7675" opacity="0.6"/>

  <!-- ヒゲ (左右2本ずつ) -->
  <line x1="12" y1="46" x2="23" y2="47" stroke="#3d2d27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="54" x2="22" y2="52" stroke="#3d2d27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="46" x2="77" y2="47" stroke="#3d2d27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="54" x2="78" y2="52" stroke="#3d2d27" stroke-width="2.5" stroke-linecap="round"/>

  <!-- リボン/下部テキスト "DONE!" (白文字) -->
  <text font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="1">
    <textPath href="#whiteTextArc" startOffset="50%" text-anchor="middle">DONE!</textPath>
  </text>
</svg>
