<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 外枠のアウトライン（肉球全体を包むスカラップ） -->
  <path d="M 50 18 C 75 18, 92 35, 92 60 C 92 82, 75 92, 50 92 C 25 92, 8 82, 8 60 C 8 35, 25 18, 50 18 Z" fill="rgba(253, 121, 168, 0.12)" stroke="#e84393" stroke-width="5" stroke-dasharray="8 4"/>
  
  <!-- 主肉球（中央の掌球） -->
  <path d="M 50 52 C 36 52, 28 64, 33 76 C 37 84, 63 84, 67 76 C 72 64, 64 52, 50 52 Z" fill="#fd79a8" stroke="#e84393" stroke-width="2"/>
  <path d="M 42 60 C 45 56, 52 56, 55 60 C 53 62, 45 62, 42 60 Z" fill="#ffffff" opacity="0.6"/>

  <!-- 指肉球（4つ） -->
  <!-- 左下 -->
  <ellipse cx="25" cy="46" rx="8" ry="11" transform="rotate(-25 25 46)" fill="#fd79a8" stroke="#e84393" stroke-width="2"/>
  <!-- 左上 -->
  <ellipse cx="38" cy="30" rx="8" ry="11" transform="rotate(-10 38 30)" fill="#fd79a8" stroke="#e84393" stroke-width="2"/>
  <!-- 右上 -->
  <ellipse cx="62" cy="30" rx="8" ry="11" transform="rotate(10 62 30)" fill="#fd79a8" stroke="#e84393" stroke-width="2"/>
  <!-- 右下 -->
  <ellipse cx="75" cy="46" rx="8" ry="11" transform="rotate(25 75 46)" fill="#fd79a8" stroke="#e84393" stroke-width="2"/>
  
  <!-- ハイライト -->
  <circle cx="36" cy="27" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="60" cy="27" r="2.5" fill="#ffffff" opacity="0.7"/>

  <!-- 小さな文字 -->
  <text x="50" y="87" font-family="'Rounded Mplus 1c', sans-serif" font-weight="900" font-size="11" fill="#e84393" text-anchor="middle">GOOD!</text>
</svg>
