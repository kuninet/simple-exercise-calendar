<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 外枠のアウトライン（肉球全体を包むスカラップ） -->
  <path d="M 50 14 C 76 14, 94 32, 94 58 C 94 80, 76 92, 50 92 C 24 92, 6 80, 6 58 C 6 32, 24 14, 50 14 Z" fill="#fff5f9" stroke="#e84393" stroke-width="5" stroke-dasharray="8 4"/>
  
  <!-- 主肉球（中央の掌球） -->
  <path d="M 50 48 C 34 48, 26 61, 31 74 C 36 83, 64 83, 69 74 C 74 61, 66 48, 50 48 Z" fill="#fd79a8" stroke="#e84393" stroke-width="2.5"/>
  <path d="M 42 56 C 45 52, 52 52, 55 56 C 53 58, 45 58, 42 56 Z" fill="#ffffff" opacity="0.6"/>

  <!-- 指肉球（4つ） -->
  <!-- 左下 -->
  <ellipse cx="23" cy="42" rx="8.5" ry="11.5" transform="rotate(-25 23 42)" fill="#fd79a8" stroke="#e84393" stroke-width="2.5"/>
  <!-- 左上 -->
  <ellipse cx="37" cy="25" rx="8.5" ry="11.5" transform="rotate(-10 37 25)" fill="#fd79a8" stroke="#e84393" stroke-width="2.5"/>
  <!-- 右上 -->
  <ellipse cx="63" cy="25" rx="8.5" ry="11.5" transform="rotate(10 63 25)" fill="#fd79a8" stroke="#e84393" stroke-width="2.5"/>
  <!-- 右下 -->
  <ellipse cx="77" cy="42" rx="8.5" ry="11.5" transform="rotate(25 77 42)" fill="#fd79a8" stroke="#e84393" stroke-width="2.5"/>
  
  <!-- ハイライト -->
  <circle cx="35" cy="22" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="61" cy="22" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="21" cy="38" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="75" cy="38" r="2" fill="#ffffff" opacity="0.7"/>
</svg>
